<div id="ConfirmationpopUp">

    <h5 class="modal-title confirmation-title" mat-dialog-title *ngIf="mydata.condition =='Check'">Edit Banking Details
        <button mat-button class="close"
            (click)="ClosepopupMessage();onNoClick(false,null); btnDisabled=true;">&times;</button>
        <!-- <h1 mat-dialog-title>Edit Banking Details</h1> -->
        <div mat-dialog-content>
            <form [formGroup]="UploadDocument">
                <div class="inv-form-inputs mb-mt">
                    <div class="add-file-input">
                        <label for="input-file3" class="file-input">
                            <img src="./assets/img/cloud-computing.png" style="cursor: pointer" />Upload
                            Cancelled Cheque.
                            <sup class="imp">*</sup>
                            <p style="margin-left: 5px" class="InvStatus__date">(upto 4MB with no special
                                characters)</p>
                        </label>
                        <input type="file" id="input-file3" class="d-none" accept="image/*" formControlName="ChequeAtt"
                            (change)="onFileSelectEvent($event,'Cancelled')" />
                        <p class="input-title">{{cancelledCheque}}</p>
                        <div *ngIf="cancelledCheque!=null && cancelledCheque!=''">
                            <i class="fa fa-close imp" aria-hidden="true" (click)="close()"></i>
                        </div>
                    </div>
                </div>
            </form>
            <div class="buttonWrapper mt-4" *ngIf="TypeNo != 'reopen'">
                <div class="row">
                    <div class="col-lg-12 text-center">
                        <!-- || checkinputbalance() -->
                        <button type="submit" class="btn button-primary" (click)="SubmitDocument()">
                            <img src="./assets/img/arrow_icon_red.png" alt="arrow icon" class="activeImg arrowIcon" />
                            <img src="./assets/img/arrow_icon_light_grey.png" alt="arrow icon"
                                class="disabledImg arrowIcon" />
                            Upload
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </h5>

<div *ngIf="mydata.specific !='Check'">
    <h5 class="modal-title confirmation-title" mat-dialog-title
    *ngIf="mydata.specific !='note' ">Confirmation
    <button mat-button class="close"
        (click)="ClosepopupMessage();onNoClick(false,null); btnDisabled=true;">&times;</button>
</h5>
</div>
    
    <h5 class="modal-title confirmation-title" mat-dialog-title *ngIf="mydata.specific =='note'">Note
        <button mat-button class="close"
            (click)="ClosepopupMessage();onNoClick(false,null); btnDisabled=true;">&times;</button>
    </h5>

    <div mat-dialog-content class="confirmation-para ">{{this.mydata.message}}</div>

    <div mat-dialog-actions
        *ngIf="!(mydata.condition =='On Hold' || mydata.condition =='Rejected' ||  mydata.condition =='Approved' || mydata.condition == 'Pending' || mydata.condition =='Continue' || mydata.condition=='Confirmation' || mydata.condition=='error' ||  mydata.condition=='return' || mydata.condition=='note' || mydata.condition=='Check')">
        <button mat-button mat-dialog-close class="btn btn-primary confirmationNo"
            (click)="onNoClick(false)">Ok</button>

    </div>
    <div mat-dialog-actions
        *ngIf="!(mydata.condition =='On Hold' || mydata.condition =='Rejected' ||  mydata.condition =='Approved' || mydata.condition == 'Pending' || mydata.condition =='Continue' || mydata.condition=='Confirmation' || mydata.condition=='error' || mydata.condition=='success' ||  mydata.condition=='return' || mydata.condition=='Check')">
        <button mat-button mat-dialog-close class="btn btn-primary confirmationNo"
            (click)="ClosepopupMessage();onNoClick(false,null)">Close</button>

    </div>

    <div mat-dialog-actions
        *ngIf="!(mydata.condition =='On Hold' || mydata.condition =='Rejected' ||  mydata.condition =='Approved' || mydata.condition == 'Pending' || mydata.condition =='Continue' || mydata.condition=='Confirmation' || mydata.condition=='success' || mydata.condition=='return' || mydata.condition=='note' || mydata.condition=='Check')">
        <button mat-button mat-dialog-close class="btn btn-primary confirmationNo"
            (click)="onNoClick(false)">Ok</button>

    </div>

    <div mat-dialog-actions
        *ngIf="(mydata.condition =='On Hold' || mydata.condition =='Rejected' ||  mydata.condition =='Approved' || mydata.condition == 'Pending' || mydata.condition =='Continue' || mydata.condition=='Confirmation'|| mydata.condition=='return')">
        <!-- <button mat-button mat-dialog-close class="btn btn-primary confirmationNo"  (click)="onNoClick()">Close</button> -->
        <div class="button__wrapper">
            <button class="btn btn-primary button-primary confirmationNo" [disabled]="btnDisabled"
                (click)="openTextarea(); btnDisabled=true;">Yes</button>
            <button class="btn btn-primary button-primary confirmationNo" [disabled]="btnDisabled"
                (click)="onNoClick(false); btnDisabled=true;">No</button>
        </div>
    </div>
    <div class="confirmation_submit" id="confirmationNoAction" *ngIf="displayTextarea">
        <div class="invoice-form p-0">
            <div class="inv-form-inputs mb-mt mt-2" style="width: 100%;">
                <div class="confirmation-formLabel">
                    Remarks
                    <div>
                        <mat-form-field appearance="none">
                            <textarea matInput placeholder="Type here..." style="width: 100%;"
                                (input)="checklength('remark')" id="remarks" #messages (keyup)="Check(messages)"
                                maxlength="160"></textarea>
                        </mat-form-field>
                        <mat-label style="font-size: 10px;display: flex;">{{remarklength}} characters out of
                            160</mat-label>
                    </div>
                </div>
            </div>
            <div id="submitButton" class="text-center w-100"> <button [disabled]="validate || messages.value ==''"
                    class="btn btn-primary button-primary confirmationNo" (click)="onNoClick(true, messages.value)">
                    <img src="./assets/img/arrow_icon_red.png" alt="arrow icon" class="activeImg arrowIcon" />
                    <img src="./assets/img/arrow_icon_light_grey.png" alt="arrow icon" class="disabledImg arrowIcon">
                    Submit</button>
            </div>

        </div>
    </div>
</div>
